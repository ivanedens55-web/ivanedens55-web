<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 715" width="800" height="715" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="My 10 public repositories as floating bubbles">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b24"/><stop offset="1" stop-color="#1b1647"/></linearGradient>
<radialGradient id="glass" cx=".32" cy=".25" r=".95"><stop offset="0" stop-color="#2a2566"/><stop offset="1" stop-color="#120f33"/></radialGradient>
<linearGradient id="rG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="#d98e00"/></linearGradient>
<linearGradient id="rV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c5ce6"/></linearGradient>
<radialGradient id="hG"><stop offset=".7" stop-color="#F5B700" stop-opacity=".16"/><stop offset="1" stop-color="#F5B700" stop-opacity="0"/></radialGradient>
<radialGradient id="hV"><stop offset=".7" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
</defs>
<style>
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.b1{animation:fl 6.4s ease-in-out -0.9s infinite}
.b2{animation:fl 6.8s ease-in-out -1.8s infinite}
.b3{animation:fl 7.2s ease-in-out -2.7s infinite}
.b4{animation:fl 6.0s ease-in-out -3.6s infinite}
.b5{animation:fl 6.4s ease-in-out -4.5s infinite}
.b6{animation:fl 6.8s ease-in-out -5.4s infinite}
.b7{animation:fl 7.2s ease-in-out -6.3s infinite}
.b8{animation:fl 6.0s ease-in-out -7.2s infinite}
.b9{animation:fl 6.4s ease-in-out -8.1s infinite}
.b10{animation:fl 6.8s ease-in-out -9.0s infinite}
.lv{animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){[class^="b"],.lv{animation:none}}
</style>
